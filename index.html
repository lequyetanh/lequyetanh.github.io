    <script>
      // Đặt theme & ngôn ngữ đã lưu TRƯỚC khi vẽ trang → không nháy sáng/tối khi tải lại.
      // Phải khớp key với ThemeStore / I18nService (prefix `qmovie.`).
      (function () {
        try {
          var root = document.documentElement;
          var theme = JSON.parse(localStorage.getItem('qmovie.theme') || 'null');
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          root.dataset.theme = theme;
          root.style.colorScheme = theme;
          var lang = JSON.parse(localStorage.getItem('qmovie.lang') || 'null');
          if (lang === 'vi' || lang === 'en') root.lang = lang;
        } catch (e) {}
      })();
    </script>
